<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب المسافة - عرض جميع المسافات</title>
<style>
    * { box-sizing: border-box; }
    body {
        color: #fff;
        background: #000;
        font-family: "Lucida Grande", Tahoma, Verdana, Arial, sans-serif;
        font-size: 14px;
        padding: 20px;
    }
    .wrap { max-width: 900px; margin: auto; }
    h1 { text-align: center; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #888; font-size: 12px; margin-bottom: 20px; }
    h2 { font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 34px; }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
    }
    th, td {
        padding: 10px;
        border: 1px solid #fff;
        text-align: center;
    }
    th { background-color: #444; }
    form { margin-top: 20px; }
    input[type="text"], input[type="search"] {
        width: 100%;
        padding: 6px;
        border: 1px solid #fff;
        background: #222;
        color: #fff;
        text-align: center;
    }
    .code-name {
        font-size: 11px;
        color: #7bd0ff;
        min-height: 14px;
        margin-top: 4px;
    }
    input[type="submit"], .btn {
        padding: 7px 24px;
        background: #444;
        color: #fff;
        border: 1px solid #666;
        cursor: pointer;
        border-radius: 3px;
        font-size: 14px;
    }
    input[type="submit"]:hover, .btn:hover { background: #555; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status {
        margin: 16px 0;
        font-size: 13px;
        padding: 10px 12px;
        border-radius: 4px;
        display: none;
    }
    .status.error { background: #3a1515; color: #ff9a9a; display: block; border: 1px solid #6a2a2a; }
    .status.ok { background: #12301c; color: #8fe3a2; display: block; border: 1px solid #245c34; }
    .status.warn { background: #3a2f15; color: #f0cf8a; display: block; border: 1px solid #6a5a2a; }

    .result-box {
        display: none;
        text-align: center;
        background: #111;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 20px;
        margin-top: 10px;
    }
    .result-box .big-distance { font-size: 34px; font-weight: bold; color: #4fc3f7; margin: 6px 0; }
    .result-box .sub { font-size: 13px; color: #aaa; }

    .stats { text-align: center; font-size: 11px; color: #666; margin-top: 8px; }

    .list-toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
    }
    .list-toolbar input[type=search] { flex: 1; min-width: 200px; }

    table.list-table { font-size: 13px; }
    table.list-table th { background: #333; }
    table.list-table tbody tr:nth-child(odd) { background: #0d0d0d; }
    table.list-table tbody tr:nth-child(even) { background: #161616; }
    table.list-table td { border-color: #333; }

    .footer-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
    }
    .pagination { display: flex; gap: 4px; flex-wrap: wrap; }
    .pagination button {
        background: #222;
        color: #ccc;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
    }
    .pagination button.active { background: #2d7dd2; color: #fff; border-color: #2d7dd2; }
    .pagination button:hover:not(.active):not(:disabled) { background: #333; }
    .info-text { font-size: 12px; color: #999; }
    .loading-msg { text-align:center; color:#888; padding: 20px; }

    .add-place-box {
        background: #111;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 16px;
        margin-top: 10px;
    }
    .add-place-box table { margin-bottom: 0; }
    .add-place-box th { background: #333; }
    .add-place-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .badge-custom {
        display: inline-block;
        font-size: 10px;
        color: #4fc3f7;
        border: 1px solid #245c74;
        border-radius: 3px;
        padding: 1px 5px;
        margin-inline-start: 6px;
    }

    .tab-nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 24px;
        border-bottom: 1px solid #333;
        padding-bottom: 12px;
    }
    .tab-nav button {
        background: #161616;
        color: #ccc;
        border: 1px solid #444;
        border-radius: 20px;
        padding: 8px 18px;
        font-size: 13px;
        cursor: pointer;
    }
    .tab-nav button:hover { background: #222; }
    .tab-nav button.active {
        background: #2d7dd2;
        color: #fff;
        border-color: #2d7dd2;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
</style>

</head>
<body>
<div class="wrap">
    <h1>حساب المسافة</h1>
    <div class="subtitle">بحث فوري وعرض كامل لبيانات المسافات (بدون اتصال بالسيرفر)</div>

    <div class="tab-nav">
        <button type="button" class="tab-btn active" data-tab="tab-distance">حساب المسافة</button>
        <button type="button" class="tab-btn" data-tab="tab-add">إضافة مكان جديد</button>
        <button type="button" class="tab-btn" data-tab="tab-list">عرض الأماكن والتعديل</button>
    </div>

    <datalist id="codesList"></datalist>

    <!-- ============ القسم 1: حساب المسافة ============ -->
    <div class="tab-panel active" id="tab-distance">
        <form id="distanceForm">
            <table>
                <tr>
                    <th>Code Chargement</th>
                    <th>Code Dechargement</th>
                </tr>
                <tr>
                    <td>
                        <input type="text" id="lieu_d" name="lieu_d" list="codesList" autocomplete="off" placeholder="مثال: 101001">
                        <div class="code-name" id="nameD"></div>
                    </td>
                    <td>
                        <input type="text" id="lieu_c" name="lieu_c" list="codesList" autocomplete="off" placeholder="مثال: 101003">
                        <div class="code-name" id="nameC"></div>
                    </td>
                </tr>
                <tr>
                    <td colspan="2"><input type="submit" value="ok"></td>
                </tr>
            </table>
        </form>

        <div id="status" class="status"></div>

        <div id="resultBox" class="result-box">
            <div class="sub">المسافة بين <b id="rLieuD"></b> و <b id="rLieuC"></b></div>
            <div class="big-distance"><span id="rDistance">--</span> Km</div>
        </div>

        <div class="stats" id="statsLine"></div>
    </div>

    <!-- ============ القسم 2: إضافة مكان جديد ============ -->
    <div class="tab-panel" id="tab-add">
        <h2 id="addPlaceTitle">إضافة مكان جديد</h2>
        <div class="add-place-box">
            <form id="addPlaceForm">
                <table>
                    <tr>
                        <th>Code (رقم المكان)</th>
                        <th>اسم المكان</th>
                    </tr>
                    <tr>
                        <td><input type="text" id="newCode" name="newCode" autocomplete="off" placeholder="مثال: 101099"></td>
                        <td><input type="text" id="newName" name="newName" autocomplete="off" placeholder="اسم المكان"></td>
                    </tr>
                </table>
                <div class="add-place-actions">
                    <button type="button" class="btn" id="btnCancelEdit" style="display:none;">إلغاء التعديل</button>
                    <button type="submit" class="btn" id="btnSubmitPlace">إضافة المكان</button>
                </div>
            </form>
            <div id="addPlaceStatus" class="status"></div>
        </div>
    </div>

    <!-- ============ القسم 3: عرض الأماكن والتعديل ============ -->
    <div class="tab-panel" id="tab-list">
        <h2>جميع الأماكن</h2>

        <div class="list-toolbar">
            <input type="search" id="listSearch" placeholder="بحث بالكود أو الاسم...">
            <button class="btn" id="btnClearSearch">مسح</button>
        </div>

        <div style="overflow-x:auto;">
            <table class="list-table">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>المكان</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="listBody"><tr><td colspan="3" class="loading-msg">جارٍ تحميل البيانات...</td></tr></tbody>
            </table>
        </div>

        <div class="footer-row">
            <div class="info-text" id="listInfo"></div>
            <div class="pagination" id="paginationBox"></div>
        </div>
    </div>
</div>

<!-- ملف البيانات منفصل: يحتوي على codeNamesArr و records -->
<script src="data.js"></script>
<script>

// ---------- التبديل بين التبويبات (الأقسام الثلاثة) ----------
const tabButtons = document.querySelectorAll('.tab-btn');
const tabPanels = document.querySelectorAll('.tab-panel');

function switchTab(tabId){
    tabPanels.forEach(function(panel){
        panel.classList.toggle('active', panel.id === tabId);
    });
    tabButtons.forEach(function(btn){
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tabId);
    });
}

tabButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
        switchTab(btn.getAttribute('data-tab'));
    });
});

const codeNames = {};
// أسماء الأماكن التفصيلية (أكواد من 6 أرقام) من مصفوفة lieu
if(typeof lieu !== 'undefined'){
    lieu.forEach(function(item){
        if(item[1]) codeNames[item[0]] = item[1];
    });
}
// أسماء المناطق العامة من codeNamesArr (لا تُستبدل الأسماء التفصيلية إن وُجدت مسبقاً)
codeNamesArr.forEach(function(item){
    if(!codeNames[item[0]]) codeNames[item[0]] = item[1];
});

// ---------- الأماكن المضافة يدويًا (تُحفظ محليًا في المتصفح) ----------
const CUSTOM_PLACES_KEY = 'customPlaces_v1';

function loadCustomPlaces(){
    try{
        const raw = localStorage.getItem(CUSTOM_PLACES_KEY);
        return raw ? JSON.parse(raw) : {};
    }catch(e){
        return {};
    }
}

function saveCustomPlaces(obj){
    try{
        localStorage.setItem(CUSTOM_PLACES_KEY, JSON.stringify(obj));
        return true;
    }catch(e){
        return false;
    }
}

let customPlaces = loadCustomPlaces();
// دمج الأماكن المضافة يدويًا فوق القائمة الأصلية (لها الأولوية)
Object.keys(customPlaces).forEach(function(code){
    codeNames[code] = customPlaces[code];
});

const distanceMap = {};
records.forEach(function(r){
    distanceMap[r[0] + '|' + r[1]] = r[2];
});

// ---------- تبويب البحث عن مسافة بين كودين ----------
const datalist = document.getElementById('codesList');
let dlHtml = '';
Object.keys(codeNames).forEach(function(code){
    dlHtml += "<option value='" + code + "'>" + code + " - " + codeNames[code] + "</option>";
});
datalist.innerHTML = dlHtml;

document.getElementById('statsLine').textContent =
    'قاعدة البيانات: ' + records.length + ' مسار بين ' + Object.keys(codeNames).length + ' موقع';

const lieuD = document.getElementById('lieu_d');
const lieuC = document.getElementById('lieu_c');
const nameD = document.getElementById('nameD');
const nameC = document.getElementById('nameC');
const statusDiv = document.getElementById('status');
const resultBox = document.getElementById('resultBox');
const rDistance = document.getElementById('rDistance');
const rLieuD = document.getElementById('rLieuD');
const rLieuC = document.getElementById('rLieuC');

function setStatus(type, msg){
    if(!type){ statusDiv.style.display = 'none'; return; }
    statusDiv.className = 'status ' + type;
    statusDiv.textContent = msg;
}

function showNameHint(input, target){
    const v = input.value.trim();
    target.textContent = codeNames[v] ? codeNames[v] : '';
}

lieuD.addEventListener('input', function(){ showNameHint(lieuD, nameD); });
lieuC.addEventListener('input', function(){ showNameHint(lieuC, nameC); });

document.getElementById('distanceForm').addEventListener('submit', function(e){
    e.preventDefault();
    resultBox.style.display = 'none';

    const a = lieuD.value.trim();
    const b = lieuC.value.trim();

    if(!a || !b){
        setStatus('error', 'الرجاء إدخال كودي التحميل والتفريغ.');
        return;
    }

    let km = distanceMap[a + '|' + b];
    let reversed = false;

    if(km === undefined){
        km = distanceMap[b + '|' + a];
        reversed = true;
    }

    if(km === undefined){
        setStatus('error', 'لا توجد بيانات مسافة مسجّلة بين هذين الكودين في قاعدة البيانات.');
        return;
    }

    rLieuD.textContent = a + (codeNames[a] ? ' - ' + codeNames[a] : '');
    rLieuC.textContent = b + (codeNames[b] ? ' - ' + codeNames[b] : '');
    rDistance.textContent = km;
    resultBox.style.display = 'block';

    if(reversed){
        setStatus('warn', 'تنبيه: لا يوجد سجل مباشر لهذا الاتجاه، تم عرض مسافة الاتجاه المعاكس (' + b + ' → ' + a + ').');
    } else {
        setStatus('ok', 'تم العثور على المسافة.');
    }
});

// ---------- تبويب عرض جميع الأماكن ----------
const listBody = document.getElementById('listBody');
const listInfo = document.getElementById('listInfo');
const paginationBox = document.getElementById('paginationBox');
const listSearch = document.getElementById('listSearch');
const btnClearSearch = document.getElementById('btnClearSearch');

// بناء قائمة الأماكن (Code + الاسم) من كائن codeNames، مرتبة حسب الكود
const places = Object.keys(codeNames)
    .map(function(code){ return [code, codeNames[code]]; })
    .sort(function(x, y){ return x[0].localeCompare(y[0]); });

const PAGE_SIZE = 50;
let filteredPlaces = places;
let currentPage = 1;

function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function applyFilter(query){
    query = (query || '').trim().toLowerCase();
    if(!query){
        filteredPlaces = places;
    } else {
        filteredPlaces = places.filter(function(p){
            const code = p[0], name = (p[1] || '').toLowerCase();
            return code.toLowerCase().includes(query) || name.includes(query);
        });
    }
    currentPage = 1;
    renderList();
}

function renderList(){
    const totalPages = Math.max(1, Math.ceil(filteredPlaces.length / PAGE_SIZE));
    if(currentPage > totalPages) currentPage = totalPages;
    if(currentPage < 1) currentPage = 1;

    const startIdx = (currentPage - 1) * PAGE_SIZE;
    const pageItems = filteredPlaces.slice(startIdx, startIdx + PAGE_SIZE);

    if(pageItems.length === 0){
        listBody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:16px;'>لا توجد نتائج</td></tr>";
    } else {
        let rowsHtml = '';
        pageItems.forEach(function(p){
            const code = p[0], name = p[1];
            const codeAttr = escapeHtml(code).replace(/"/g, '&quot;');
            rowsHtml += "<tr>" +
                "<td>" + escapeHtml(code) + "</td>" +
                "<td>" + escapeHtml(name || '') + "</td>" +
                "<td><button type='button' class='btn' data-code=\"" + codeAttr + "\" onclick='startEditPlace(this.getAttribute(\"data-code\"))'>تعديل</button></td>" +
                "</tr>";
        });
        listBody.innerHTML = rowsHtml;
    }

    listInfo.textContent = 'عرض ' + (filteredPlaces.length === 0 ? 0 : startIdx + 1) + ' إلى ' +
        Math.min(startIdx + PAGE_SIZE, filteredPlaces.length) + ' من أصل ' + filteredPlaces.length + ' مكان';

    renderPagination(currentPage, totalPages);
}

function renderPagination(current, totalPages){
    let html = '';
    html += "<button " + (current<=1?'disabled':'') + " onclick='goToPage(" + (current-1) + ")'>&laquo; Préc</button>";

    const start = Math.max(1, current - 2);
    const end = Math.min(totalPages, current + 2);
    for(let p = start; p <= end; p++){
        html += "<button class='" + (p===current?'active':'') + "' onclick='goToPage(" + p + ")'>" + p + "</button>";
    }

    html += "<button " + (current>=totalPages?'disabled':'') + " onclick='goToPage(" + (current+1) + ")'>Suiv &raquo;</button>";
    paginationBox.innerHTML = html;
}

function goToPage(p){
    currentPage = p;
    renderList();
}

listSearch.addEventListener('input', function(){
    applyFilter(listSearch.value);
});
btnClearSearch.addEventListener('click', function(){
    listSearch.value = '';
    applyFilter('');
});

// ---------- إضافة / تعديل مكان ----------
const addPlaceForm = document.getElementById('addPlaceForm');
const addPlaceStatus = document.getElementById('addPlaceStatus');
const addPlaceTitle = document.getElementById('addPlaceTitle');
const newCodeInput = document.getElementById('newCode');
const newNameInput = document.getElementById('newName');
const btnSubmitPlace = document.getElementById('btnSubmitPlace');
const btnCancelEdit = document.getElementById('btnCancelEdit');

let editingCode = null; // null = وضع إضافة، غير ذلك = وضع تعديل لهذا الكود

function setAddPlaceStatus(type, msg){
    if(!type){ addPlaceStatus.style.display = 'none'; return; }
    addPlaceStatus.className = 'status ' + type;
    addPlaceStatus.textContent = msg;
}

function enterEditMode(code){
    editingCode = code;
    newCodeInput.value = code;
    newCodeInput.disabled = true;
    newNameInput.value = codeNames[code] || '';
    addPlaceTitle.textContent = 'تعديل المكان: ' + code;
    btnSubmitPlace.textContent = 'حفظ التعديل';
    btnCancelEdit.style.display = '';
    setAddPlaceStatus(null);
    switchTab('tab-add');
    newNameInput.focus();
}

function exitEditMode(){
    editingCode = null;
    newCodeInput.disabled = false;
    addPlaceTitle.textContent = 'إضافة مكان جديد';
    btnSubmitPlace.textContent = 'إضافة المكان';
    btnCancelEdit.style.display = 'none';
    addPlaceForm.reset();
    switchTab('tab-list');
}

// تُستدعى من زر "تعديل" في جدول الأماكن (انظر renderList)
function startEditPlace(code){
    if(!Object.prototype.hasOwnProperty.call(codeNames, code)) return;
    enterEditMode(code);
}

btnCancelEdit.addEventListener('click', function(){
    exitEditMode();
    setAddPlaceStatus(null);
});

addPlaceForm.addEventListener('submit', function(e){
    e.preventDefault();

    const code = editingCode ? editingCode : newCodeInput.value.trim();
    const name = newNameInput.value.trim();

    if(!code || !name){
        setAddPlaceStatus('error', 'الرجاء إدخال الكود واسم المكان.');
        return;
    }

    const isUpdate = editingCode !== null || Object.prototype.hasOwnProperty.call(codeNames, code);

    // تحديث القاموس والتخزين المحلي
    codeNames[code] = name;
    customPlaces[code] = name;
    const saved = saveCustomPlaces(customPlaces);

    // تحديث القائمة المنسدلة (datalist) الخاصة بحساب المسافة
    const escapedCode = code.replace(/'/g, "\\'");
    let existingOpt = datalist.querySelector("option[value='" + escapedCode + "']");
    if(!existingOpt){
        const opt = document.createElement('option');
        opt.value = code;
        opt.textContent = code + ' - ' + name;
        datalist.appendChild(opt);
    } else {
        existingOpt.textContent = code + ' - ' + name;
    }

    // تحديث/إضافة السطر في مصفوفة الأماكن ثم إعادة الترتيب والعرض
    const idx = places.findIndex(function(p){ return p[0] === code; });
    if(idx >= 0){
        places[idx][1] = name;
    } else {
        places.push([code, name]);
    }
    places.sort(function(x, y){ return x[0].localeCompare(y[0]); });

    document.getElementById('statsLine').textContent =
        'قاعدة البيانات: ' + records.length + ' مسار بين ' + Object.keys(codeNames).length + ' موقع';

    applyFilter(listSearch.value);

    const wasEditing = editingCode !== null;

    if(!saved){
        setAddPlaceStatus('warn', 'تم الحفظ لهذه الجلسة فقط، لكن تعذّر حفظه بشكل دائم في هذا المتصفح.');
    } else if(wasEditing || isUpdate){
        setAddPlaceStatus('ok', 'تم تحديث اسم المكان بالكود ' + code + ' بنجاح.');
    } else {
        setAddPlaceStatus('ok', 'تمت إضافة المكان "' + name + '" بالكود ' + code + ' بنجاح، وسيبقى محفوظًا في هذا المتصفح.');
    }

    if(wasEditing){
        exitEditMode();
    } else {
        addPlaceForm.reset();
    }
});

renderList();
</script>
</body>
</html>
